name: Matsya CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matsya-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend suite
        working-directory: backend
        run: python -m pytest tests -q --tb=short

  frontend:
    name: Frontend checks and Chromium production tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies for browser tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
          echo "MATSYA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build production application
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare browser test report directory
        run: mkdir -p test-results
      - name: Run Chromium tests against the production build
        working-directory: frontend
        env:
          MATSYA_PYTHON: ${{ env.MATSYA_PYTHON }}
          PLAYWRIGHT_JSON_REPORT: ../test-results/e2e-ci.json
        run: npx playwright test --project=chromium

  container-and-architecture:
    name: Multi-architecture images and production smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up image builder
        uses: docker/setup-buildx-action@v3
      - name: Build backend for AMD64 and ARM64 (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          tags: matsya-backend:ci
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/matsya-backend-multiarch.tar
      - name: Build frontend for AMD64 and ARM64 (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          tags: matsya-frontend:ci
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/matsya-frontend-multiarch.tar
      - name: Set up Python for production smoke
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF verification dependency
        run: python -m pip install pypdf
      - name: Prepare non-secret runtime configuration
        run: cp deploy/.env.example deploy/.env
      - name: Build and start the production stack
        run: docker compose -f deploy/docker-compose.prod.yml up -d --build --wait
      - name: Run production smoke checks
        run: python scripts/smoke_prod.py http://127.0.0.1 --restart-backend
      - name: Capture service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml down --volumes --remove-orphans
