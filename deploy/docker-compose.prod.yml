name: matsya
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - matsya-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_DRIVE_URL: ${NEXT_PUBLIC_DRIVE_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_INDEXABLE: ${NEXT_PUBLIC_INDEXABLE:-0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
volumes:
  matsya-data:
  caddy-data:
  caddy-config:
