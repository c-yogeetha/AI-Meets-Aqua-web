name: matsya
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      network: host
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    platform: ${TARGETPLATFORM:-linux/amd64}
    env_file: .env
    environment:
      DATA_DIR: /data
      ANALYZER: ${ANALYZER:-auto}
      MODELS_DIR: /srv/models
      OMP_NUM_THREADS: "2"
      OPENCV_NUM_THREADS: "2"
    volumes:
      - matsya-data:/data
      - ./models:/srv/models:ro
    mem_limit: 6g
    cpus: 1.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      network: host
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        NEXT_PUBLIC_DRIVE_URL: ${NEXT_PUBLIC_DRIVE_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_INDEXABLE: ${NEXT_PUBLIC_INDEXABLE:-0}
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  matsya-data:
  caddy-data:
  caddy-config:
